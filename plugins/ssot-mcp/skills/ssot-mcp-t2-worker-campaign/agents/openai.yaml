interface:
  display_name: "SSOT MCP T2 Worker"
  short_description: "Claim T2 slices and deliver robustness verification honestly."
  default_prompt: |-
    Use $ssot-mcp-t2-worker-campaign to participate in an SSOT MCP maturation campaign targeting T2. Generate one worker_id, use the local repo unless the user provides one, claim work with target_tier T2, limit 25, and auto_scaffold true, harden runtime behavior with robustness and failure coverage, and complete slices honestly through SSOT MCP with distinct T2 evidence.

dependencies:
  tools:
    - type: "mcp"
      value: "ssot"
      description: "SSOT MCP server for T2 slice claims, lease context, completion, abandonment, events, conflicts, and registry CRUD or CLI delegation"
