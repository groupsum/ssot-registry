summary: "The graph command SHALL support a self-contained HTML lineage export derived from the canonical registry graph. The view SHALL expose network and top-down lineage modes, node family filters, search, depth-limited focus traversal, node selection/deselection, fit-to-visible graph, and x/y stratification spacing controls. The generated HTML SHALL be a non-canonical projection and SHALL embed enough graph metadata for local offline review."
