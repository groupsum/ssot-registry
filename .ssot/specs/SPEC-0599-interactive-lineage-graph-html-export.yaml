body: |-
  Scope
  The graph command shall support a self-contained HTML lineage export derived from the canonical registry graph.
  
  Evidence-centered lineage
  The lineage view shall expose evidence-centered proof paths. Claim lineage shall be rendered as `claim <- evidence <- test` when test-produced evidence exists. Feature assurance lineage shall be rendered as `feature -> claim <- evidence <- test`.
  
  The view may show derived test-to-claim verification edges for operator convenience, but those edges shall be labeled as derived from evidence links and shall not be presented as canonical proof authority.
  
  Interactive viewer parity
  The generated HTML shall expose selected-node details, connected edges, a visible family legend, package or repository context, visible graph edges, x-axis and y-axis lineage spacing controls, maximum hop-depth traversal, zoom controls, select/deselect behavior, draggable visible nodes, selected-node ego focus, and PNG/SVG snapshot export.
  
  Diagnostics
  The generated HTML shall expose diagnostics for evidence without supporting claim links, claims without supporting evidence, evidence producer gaps, and compatibility mirror mismatches. Generated lineage HTML remains a non-canonical projection and shall embed enough graph metadata for local offline review.
