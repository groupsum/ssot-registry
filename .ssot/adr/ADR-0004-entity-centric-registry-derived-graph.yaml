body: |-
  Summary
  The canonical registry remains entity-centric JSON with explicit references. Graph exports, lineage views, DOT, SVG, and HTML are derived projections from canonical registry truth.
  
  Decision
  Graph projections shall distinguish canonical registry relationships from derived convenience relationships. Evidence-centered proof lineage is projected from canonical evidence links: tests produce evidence, and evidence supports claims. Direct test-to-claim verification edges, when shown, are derived from the evidence path and shall be labeled as derived rather than treated as canonical proof authority.
  
  Implications
  Graph exports may continue to include convenience edges for review, but the export metadata and lineage views shall make proof authority clear. Orphan evidence, claims without supporting evidence, and compatibility mirror mismatches shall be visible as graph diagnostics instead of being hidden by redundant triangle edges.
